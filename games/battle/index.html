<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1224">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Khelo Battleground - a third-person battle royale on a map shaped like India, written in Python.">
  <title>Khelo Battleground - 3D Battle Royale</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
    }
  }
  </script>
</head>
<body data-orient="landscape">
  <main class="stage">
    <div class="bar">
      <a class="ctrl home" href="../../" title="All games" aria-label="All games">&#8962;</a>
      <span class="grow"></span>
      <button id="mute" class="ctrl" type="button" aria-pressed="false" title="Toggle sound" aria-label="Toggle sound">
        <span id="mute-icon" aria-hidden="true">&#128266;</span>
      </button>
      <button id="fs" class="ctrl" type="button" aria-pressed="false" title="Full screen" aria-label="Full screen">&#9974;</button>
    </div>

    <div class="screen">
      <canvas id="game" aria-label="Khelo Battleground 3D view"></canvas>
      <canvas id="hud" aria-hidden="true"></canvas>

      <div id="loader" class="loader">
        <div class="loader-card">
          <h1>KHELO<span>BATTLE</span></h1>
          <p id="loader-msg">Starting up…</p>
          <div class="bar-track"><i id="loader-bar"></i></div>
          <p class="loader-note">A Python game running in your browser via Pyodide.</p>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
  <script type="module">
    import * as THREE from 'three';

    /* ==================================================================
       Sound - all synthesised, no audio files
       ================================================================== */
    let actx = null, muted = false, noiseBuf = null;

    function audio() {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
      return actx;
    }
    function noiseSource() {
      if (noiseBuf) return noiseBuf;
      const n = Math.floor(actx.sampleRate * 0.4);
      noiseBuf = actx.createBuffer(1, n, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      return noiseBuf;
    }
    function noise(dur, vol, freq, q, when) {
      const t = when || actx.currentTime;
      const src = actx.createBufferSource();
      src.buffer = noiseSource();
      const f = actx.createBiquadFilter();
      f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
      const g = actx.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f); f.connect(g); g.connect(actx.destination);
      src.start(t); src.stop(t + dur + 0.02);
    }
    function tone(f0, f1, dur, type, vol, when) {
      const t = when || actx.currentTime;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type || "sine";
      o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + dur + 0.03);
    }

    window.playSound = function (name) {
      if (muted) return;
      try {
        audio();
        const t = actx.currentTime;
        switch (name) {
          case "shot":
            noise(0.07, 0.13, 1100, 1.2); tone(320, 90, 0.09, "square", 0.07);
            break;
          case "hit":
            noise(0.09, 0.10, 700, 2); tone(520, 260, 0.08, "triangle", 0.06);
            break;
          case "hurt":
            tone(220, 90, 0.22, "sawtooth", 0.10); noise(0.14, 0.07, 500, 1.5);
            break;
          case "zone":
            tone(180, 300, 0.5, "sine", 0.07); tone(300, 180, 0.5, "triangle", 0.05, t + 0.25);
            break;
          case "win":
            [523, 659, 784, 1047].forEach((f, k) => tone(f, f, 0.34, "triangle", 0.09, t + k * 0.14));
            break;
          case "lose":
            tone(300, 90, 0.7, "sine", 0.10); tone(200, 70, 0.7, "triangle", 0.06, t + 0.12);
            break;
          case "start":
            tone(260, 660, 0.3, "square", 0.07);
            break;
          case "tap":
            tone(760, 620, 0.045, "square", 0.045);
            break;
        }
      } catch (e) { /* audio is a nicety */ }
    };

    /* ==================================================================
       The 3D world
       ================================================================== */
    const gameCanvas = document.getElementById("game");
    const hudCanvas = document.getElementById("hud");
    const screenBox = document.querySelector(".screen");

    let renderer, scene, camera, waterMesh, zoneMesh, zoneRing, playerRig, dirArrow,
        botRigs = [],
        bulletPool = [], sparkPool = [], sunLight;
    let WORLD = { w: 1000, h: 1000, water: -2 };
    let treePos = [];
    let flashTimer = 0, flashMesh = null, camSmooth = null, lastT = 0;
    const cratePool = [], dmgPool = [], dustPool = [], blockPos = [];
    let dustTimer = 0, fovNow = 62;
    let ready3d = false;

    function rngFactory(seed) {
      let s = seed >>> 0;
      return function () {
        s = (s * 1664525 + 1013904223) >>> 0;
        return s / 4294967296;
      };
    }

    function hash01(i, j) {
      const s = Math.sin(i * 127.1 + j * 311.7) * 43758.5453;
      return s - Math.floor(s);
    }

    function terrainColour(h, water) {
      const c = new THREE.Color();
      if (h < water + 0.6) c.setHex(0x2f5d7c);            // sea bed
      else if (h < water + 2.2) c.setHex(0xd8cba0);       // sand
      else if (h < 16) c.setHex(0x3f7a4a);                // grass
      else if (h < 30) c.setHex(0x2f6138);                // darker green
      else if (h < 44) c.setHex(0x6b6152);                // rock
      else c.setHex(0xd9e2ea);                            // snow
      return c;
    }

    function skyTexture() {
      const c = document.createElement('canvas');
      c.width = 16; c.height = 256;
      const g = c.getContext('2d');
      const grad = g.createLinearGradient(0, 0, 0, 256);
      grad.addColorStop(0.00, '#2f6ec4');
      grad.addColorStop(0.42, '#7fb2e2');
      grad.addColorStop(0.72, '#bcd9ef');
      grad.addColorStop(1.00, '#e6f1f9');
      g.fillStyle = grad;
      g.fillRect(0, 0, 16, 256);
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      return t;
    }

    function buildTerrain(payload) {
      const { nx, nz, w, h, water, heights } = payload;
      WORLD = { w, h, water };
      const cellX = w / nx, cellZ = h / nz;

      const pos = new Float32Array(nx * nz * 3);
      const col = new Float32Array(nx * nz * 3);
      const tmp = new THREE.Color();
      for (let j = 0; j < nz; j++) {
        for (let i = 0; i < nx; i++) {
          const k = j * nx + i;
          const hh = heights[k];
          pos[k * 3] = (i + 0.5) * cellX;
          pos[k * 3 + 1] = hh;
          pos[k * 3 + 2] = (j + 0.5) * cellZ;
          tmp.copy(terrainColour(hh, water));
          tmp.multiplyScalar(0.88 + 0.26 * hash01(i, j));
          col[k * 3] = tmp.r; col[k * 3 + 1] = tmp.g; col[k * 3 + 2] = tmp.b;
        }
      }
      const idx = [];
      for (let j = 0; j < nz - 1; j++) {
        for (let i = 0; i < nx - 1; i++) {
          const a = j * nx + i, b = a + 1, c = a + nx, d = c + 1;
          idx.push(a, c, b, b, c, d);
        }
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
      geo.setIndex(idx);
      geo.computeVertexNormals();

      const mat = new THREE.MeshLambertMaterial({ vertexColors: true });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.name = "terrain";
      scene.add(mesh);

      // the sea
      const seaGeo = new THREE.PlaneGeometry(w * 3, h * 3, 1, 1);
      seaGeo.rotateX(-Math.PI / 2);
      waterMesh = new THREE.Mesh(seaGeo, new THREE.MeshLambertMaterial({
        color: 0x2d6d9e, transparent: true, opacity: 0.86
      }));
      waterMesh.position.set(w / 2, water, h / 2);
      scene.add(waterMesh);

      // trees and rocks, scattered where the ground is walkable
      const rnd = rngFactory(20261125);
      const treeCount = 1600, rockCount = 420;
      const trunkGeo = new THREE.CylinderGeometry(0.42, 0.6, 3.0, 5);
      const leafGeo = new THREE.ConeGeometry(2.1, 7.0, 6);
      const trunkMat = new THREE.MeshLambertMaterial({ color: 0x5b4632 });
      const leafMat = new THREE.MeshLambertMaterial({ color: 0x2c6b3a });
      const trunks = new THREE.InstancedMesh(trunkGeo, trunkMat, treeCount);
      const leaves = new THREE.InstancedMesh(leafGeo, leafMat, treeCount);
      const m4 = new THREE.Matrix4();
      const q = new THREE.Quaternion();
      let placed = 0, guard = 0;
      while (placed < treeCount && guard < treeCount * 40) {
        guard++;
        const x = rnd() * w, z = rnd() * h;
        const gx = Math.min(nx - 1, Math.floor(x / cellX));
        const gz = Math.min(nz - 1, Math.floor(z / cellZ));
        const hh = heights[gz * nx + gx];
        if (hh < water + 2.5 || hh > 34) continue;
        const s = 0.7 + rnd() * 0.8;
        q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), rnd() * 6.283);
        m4.compose(new THREE.Vector3(x, hh + 1.5 * s, z), q, new THREE.Vector3(s, s, s));
        trunks.setMatrixAt(placed, m4);
        m4.compose(new THREE.Vector3(x, hh + 5.3 * s, z), q, new THREE.Vector3(s, s, s));
        leaves.setMatrixAt(placed, m4);
        treePos.push({ x: x, z: z });
        placed++;
      }
      trunks.count = placed; leaves.count = placed;
      trunks.instanceMatrix.needsUpdate = true;
      leaves.instanceMatrix.needsUpdate = true;
      scene.add(trunks); scene.add(leaves);

      const rockGeo = new THREE.DodecahedronGeometry(2.2, 0);
      const rockMat = new THREE.MeshLambertMaterial({ color: 0x8b8b86 });
      const rocks = new THREE.InstancedMesh(rockGeo, rockMat, rockCount);
      let rp = 0; guard = 0;
      while (rp < rockCount && guard < rockCount * 40) {
        guard++;
        const x = rnd() * w, z = rnd() * h;
        const gx = Math.min(nx - 1, Math.floor(x / cellX));
        const gz = Math.min(nz - 1, Math.floor(z / cellZ));
        const hh = heights[gz * nx + gx];
        if (hh < water + 1.0) continue;
        const s = 0.6 + rnd() * 1.6;
        q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), rnd() * 6.283);
        m4.compose(new THREE.Vector3(x, hh + 0.9 * s, z), q, new THREE.Vector3(s, s * 0.8, s));
        rocks.setMatrixAt(rp, m4);
        rp++;
      }
      rocks.count = rp;
      rocks.instanceMatrix.needsUpdate = true;
      scene.add(rocks);

      // distant peaks, so the horizon is not an empty edge
      const mtnGeo = new THREE.ConeGeometry(1, 1, 5);
      const mtnMat = new THREE.MeshLambertMaterial({ color: 0x63799a });
      const mtns = new THREE.InstancedMesh(mtnGeo, mtnMat, 64);
      const mrnd = rngFactory(4242);
      for (let i = 0; i < 64; i++) {
        const a = (i / 64) * Math.PI * 2 + mrnd() * 0.1;
        const rad = 1750 + mrnd() * 420;
        const hgt = 150 + mrnd() * 340;
        const wid = 150 + mrnd() * 220;
        q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), mrnd() * 6.283);
        m4.compose(new THREE.Vector3(w / 2 + Math.cos(a) * rad, hgt / 2 - 20,
                                     h / 2 + Math.sin(a) * rad),
                   q, new THREE.Vector3(wid, hgt, wid));
        mtns.setMatrixAt(i, m4);
      }
      mtns.instanceMatrix.needsUpdate = true;
      scene.add(mtns);

      // ---- 14. grass tufts, so the ground is not bare ----
      const tuftGeo = new THREE.ConeGeometry(0.55, 1.7, 3);
      const tuftMat = new THREE.MeshLambertMaterial({ color: 0x4f9455 });
      const tufts = new THREE.InstancedMesh(tuftGeo, tuftMat, 4600);
      const grnd = rngFactory(777);
      let tp = 0, tguard = 0;
      while (tp < 4600 && tguard < 4600 * 24) {
        tguard++;
        const x = grnd() * w, z = grnd() * h;
        const gx = Math.min(nx - 1, Math.floor(x / cellX));
        const gz = Math.min(nz - 1, Math.floor(z / cellZ));
        const hh = heights[gz * nx + gx];
        if (hh < water + 2.2 || hh > 26) continue;
        const sc = 0.6 + grnd() * 1.1;
        q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), grnd() * 6.283);
        m4.compose(new THREE.Vector3(x, hh + 0.85 * sc, z), q,
                   new THREE.Vector3(sc, sc, sc));
        tufts.setMatrixAt(tp, m4);
        tp++;
      }
      tufts.count = tp;
      tufts.instanceMatrix.needsUpdate = true;
      scene.add(tufts);

      // ---- towns: buildings with pitched roofs ----
      const blds = payload.buildings || [];
      if (blds.length) {
        // bilinear, exactly like Python's height_at, so a road and its bridge
        // always agree about where the water starts
        const sample = function (x, z) {
          const gx = x / cellX - 0.5, gz = z / cellZ - 0.5;
          let i = Math.floor(gx), j = Math.floor(gz);
          let fx = gx - i, fz = gz - j;
          i = Math.max(0, Math.min(nx - 2, i));
          j = Math.max(0, Math.min(nz - 2, j));
          fx = Math.max(0, Math.min(1, fx));
          fz = Math.max(0, Math.min(1, fz));
          const h00 = heights[j * nx + i], h10 = heights[j * nx + i + 1];
          const h01 = heights[(j + 1) * nx + i], h11 = heights[(j + 1) * nx + i + 1];
          return (h00 * (1 - fx) + h10 * fx) * (1 - fz)
               + (h01 * (1 - fx) + h11 * fx) * fz;
        };
        const wallGeo = new THREE.BoxGeometry(1, 1, 1);
        const wallMat = new THREE.MeshLambertMaterial({ color: 0xbcb2a0 });
        const roofGeo = new THREE.ConeGeometry(0.74, 1, 4);
        const roofMat = new THREE.MeshLambertMaterial({ color: 0x7d4438 });
        const walls = new THREE.InstancedMesh(wallGeo, wallMat, blds.length);
        const roofs = new THREE.InstancedMesh(roofGeo, roofMat, blds.length);
        const noRot = new THREE.Quaternion();
        const yRot = new THREE.Quaternion().setFromAxisAngle(
          new THREE.Vector3(0, 1, 0), Math.PI / 4);
        for (let i = 0; i < blds.length; i++) {
          const b = blds[i];
          blockPos.push({ x: b[0], z: b[1], r: Math.max(b[2], b[3]) * 0.6 });
          const bx = b[0], bz = b[1], bw = b[2], bd = b[3], bh = b[4];
          const gy = sample(bx, bz);
          m4.compose(new THREE.Vector3(bx, gy + bh / 2, bz), noRot,
                     new THREE.Vector3(bw, bh, bd));
          walls.setMatrixAt(i, m4);
          m4.compose(new THREE.Vector3(bx, gy + bh + bh * 0.20, bz), yRot,
                     new THREE.Vector3(Math.max(bw, bd) * 0.80, bh * 0.42,
                                       Math.max(bw, bd) * 0.80));
          roofs.setMatrixAt(i, m4);
        }
        walls.instanceMatrix.needsUpdate = true;
        roofs.instanceMatrix.needsUpdate = true;
        scene.add(walls); scene.add(roofs);

        // ---- roads, and bridges where a road meets water ----
        const roadMat = new THREE.MeshLambertMaterial({
          color: 0x7f7a6b, side: THREE.DoubleSide
        });
        const deckMat = new THREE.MeshLambertMaterial({ color: 0x8d8578 });
        const railMat = new THREE.MeshLambertMaterial({ color: 0x6d6659 });
        const postMat = new THREE.MeshLambertMaterial({ color: 0x5f594e });
        let bridges = 0;

        for (const road of (payload.roads || [])) {
          const verts = [], idx = [];
          for (let i = 0; i < road.length; i++) {
            const x = road[i][0], z = road[i][1];
            const a = road[Math.max(0, i - 1)], b2 = road[Math.min(road.length - 1, i + 1)];
            let dx = b2[0] - a[0], dz = b2[1] - a[1];
            const len = Math.hypot(dx, dz) || 1;
            dx /= len; dz /= len;
            const px = -dz, pz = dx;
            const half = 6.0;
            const g0 = sample(x, z);
            const y = g0 < water + 0.6 ? water + 3.25 : g0 + 0.4;
            verts.push(x + px * half, y, z + pz * half);
            verts.push(x - px * half, y, z - pz * half);
          }
          for (let i = 0; i < road.length - 1; i++) {
            const a = i * 2, b2 = a + 1, c = a + 2, d = a + 3;
            idx.push(a, c, b2, b2, c, d);
          }
          const g = new THREE.BufferGeometry();
          g.setAttribute("position", new THREE.Float32BufferAttribute(verts, 3));
          g.setIndex(idx);
          g.computeVertexNormals();
          scene.add(new THREE.Mesh(g, roadMat));

          // a bridge for every stretch that crosses water
          for (let i = 0; i < road.length - 1 && bridges < 60; i++) {
            const p1 = road[i], p2 = road[i + 1];
            if (Math.min(sample(p1[0], p1[1]), sample(p2[0], p2[1])) >= water + 0.6) continue;
            const cx = (p1[0] + p2[0]) / 2, cz = (p1[1] + p2[1]) / 2;
            const seg = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) + 3;
            const ang = Math.atan2(p2[0] - p1[0], p2[1] - p1[1]);
            const deck = new THREE.Mesh(new THREE.BoxGeometry(14, 1.8, seg), deckMat);
            deck.position.set(cx, water + 2.3, cz);
            deck.rotation.y = ang;
            scene.add(deck);
            for (let sgn = -1; sgn <= 1; sgn += 2) {
              const rail = new THREE.Mesh(new THREE.BoxGeometry(0.7, 3.2, seg), railMat);
              rail.position.set(cx + Math.cos(ang) * 6.8 * sgn, water + 4.4,
                                cz - Math.sin(ang) * 6.8 * sgn);
              rail.rotation.y = ang;
              scene.add(rail);
            }
            const post = new THREE.Mesh(new THREE.BoxGeometry(3.4, 9, 3.4), postMat);
            post.position.set(cx, water - 1.4, cz);
            scene.add(post);
            bridges++;
          }
        }
      }

      // the closing zone: a tall translucent wall
      const zoneGeo = new THREE.CylinderGeometry(1, 1, 900, 72, 1, true);
      zoneMesh = new THREE.Mesh(zoneGeo, new THREE.MeshBasicMaterial({
        color: 0x4aa8ff, transparent: true, opacity: 0.42,
        side: THREE.DoubleSide, depthWrite: false
      }));
      zoneMesh.position.y = 400;
      scene.add(zoneMesh);

      // a bright line where the wall meets the ground
      const ringGeo = new THREE.RingGeometry(0.965, 1.0, 96);
      ringGeo.rotateX(-Math.PI / 2);
      zoneRing = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({
        color: 0x7fc4ff, transparent: true, opacity: 0.55,
        side: THREE.DoubleSide, depthWrite: false
      }));
      zoneRing.position.y = 44;
      scene.add(zoneRing);
    }

    function makeSoldier(colour, skin) {
      const g = new THREE.Group();
      const bodyMat = new THREE.MeshLambertMaterial({ color: colour });
      const skinMat = new THREE.MeshLambertMaterial({ color: skin });
      const darkMat = new THREE.MeshLambertMaterial({ color: 0x2b2f38 });

      const legs = new THREE.Mesh(new THREE.BoxGeometry(1.7, 1.9, 1.0), darkMat);
      legs.position.y = 0.95;
      g.add(legs);

      const torso = new THREE.Mesh(new THREE.BoxGeometry(1.9, 2.0, 1.1), bodyMat);
      torso.position.y = 2.9;
      g.add(torso);

      const head = new THREE.Mesh(new THREE.BoxGeometry(1.15, 1.15, 1.15), skinMat);
      head.position.y = 4.35;
      g.add(head);

      const helmet = new THREE.Mesh(new THREE.BoxGeometry(1.35, 0.55, 1.35), bodyMat);
      helmet.position.y = 4.95;
      g.add(helmet);

      const armMat = new THREE.MeshLambertMaterial({
        color: new THREE.Color(colour).multiplyScalar(0.76)
      });
      const armL = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.7, 0.6), armMat);
      armL.position.set(-1.25, 3.0, 0.1);
      g.add(armL);
      const armR = armL.clone();
      armR.position.x = 1.25;
      g.add(armR);

      // boots
      const bootL = new THREE.Mesh(new THREE.BoxGeometry(0.72, 0.5, 1.3), darkMat);
      bootL.position.set(-0.45, 0.25, 0.1);
      g.add(bootL);
      const bootR = bootL.clone();
      bootR.position.x = 0.45;
      g.add(bootR);

      // a pack on the back
      const pack = new THREE.Mesh(new THREE.BoxGeometry(1.05, 0.95, 0.42),
        new THREE.MeshLambertMaterial({ color: 0x6b7280 }));
      pack.position.set(0, 3.05, -0.72);
      g.add(pack);

      // shoulder pads
      const padL = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.45, 0.9), darkMat);
      padL.position.set(-1.25, 3.75, 0.1);
      g.add(padL);
      const padR = padL.clone();
      padR.position.x = 1.25;
      g.add(padR);

      // a visor across the helmet
      const visor = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.3, 0.12),
        new THREE.MeshLambertMaterial({ color: 0x1d2637 }));
      visor.position.set(0, 4.35, 0.6);
      g.add(visor);

      // the gun, swapped out when the weapon changes
      const gun = new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.30, 2.2), darkMat);
      gun.position.set(1.25, 3.0, 1.0);
      g.add(gun);

      // a soft blob shadow, cheaper than a real shadow map
      const blob = new THREE.Mesh(
        new THREE.CircleGeometry(2.2, 16),
        new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.28 })
      );
      blob.rotation.x = -Math.PI / 2;
      blob.position.y = 0.08;
      g.add(blob);

      g.userData = { legs: legs, arms: [armL, armR], walk: 0, gun: gun,
                     bodyMat: bodyMat, darkMat: darkMat };
      return g;
    }

    function buildActors() {
      playerRig = makeSoldier(0x3f7a4a, 0xd9a86c);
      playerRig.scale.setScalar(1.3);
      scene.add(playerRig);
      for (let i = 0; i < 12; i++) {
        const rig = makeSoldier(0x8a3b3b, 0xd9a86c);
        rig.scale.setScalar(1.3);
        rig.visible = false;
        scene.add(rig);
        botRigs.push(rig);
      }
      // a bullet is a glowing streak, not a floating dot
      const bGeo = new THREE.BoxGeometry(0.16, 0.16, 3.4);
      const bMat = new THREE.MeshBasicMaterial({ color: 0xffe08a, transparent: true, opacity: 0.95 });
      for (let i = 0; i < 60; i++) {
        const m = new THREE.Mesh(bGeo, bMat);
        m.visible = false;
        scene.add(m);
        bulletPool.push(m);
      }
      const sGeo = new THREE.SphereGeometry(0.5, 6, 5);
      for (let i = 0; i < 24; i++) {
        const m = new THREE.Mesh(sGeo, new THREE.MeshBasicMaterial({
          color: 0xffc44d, transparent: true, opacity: 0.9
        }));
        m.visible = false;
        scene.add(m);
        sparkPool.push(m);
      }

      // crates: green for health, yellow for ammo
      const crateGeo = new THREE.BoxGeometry(2.4, 2.0, 2.4);
      for (let i = 0; i < 32; i++) {
        const h = new THREE.Mesh(crateGeo, new THREE.MeshLambertMaterial({
          color: 0x2fbf6a, emissive: 0x0d3d22
        }));
        const a = new THREE.Mesh(crateGeo, new THREE.MeshLambertMaterial({
          color: 0xd9a827, emissive: 0x3d2c08
        }));
        h.visible = false; a.visible = false;
        scene.add(h); scene.add(a);
        cratePool.push({ health: h, ammo: a });
      }

      // floating damage numbers
      for (let i = 0; i < 10; i++) {
        const cv = document.createElement("canvas");
        cv.width = 128; cv.height = 64;
        const tex = new THREE.CanvasTexture(cv);
        tex.colorSpace = THREE.SRGBColorSpace;
        const sp = new THREE.Sprite(new THREE.SpriteMaterial({
          map: tex, transparent: true, depthWrite: false
        }));
        sp.visible = false;
        sp.scale.set(6, 3, 1);
        scene.add(sp);
        dmgPool.push({ sprite: sp, canvas: cv, tex: tex });
      }

      // footstep dust
      const dustGeo = new THREE.SphereGeometry(0.9, 5, 4);
      for (let i = 0; i < 12; i++) {
        const m = new THREE.Mesh(dustGeo, new THREE.MeshBasicMaterial({
          color: 0xcfc7a8, transparent: true, opacity: 0
        }));
        m.visible = false;
        scene.add(m);
        dustPool.push({ mesh: m, life: 0 });
      }

      // a floating arrow over the soldier, so you can always tell which way
      // the camera is pointing
      // a flat arrowhead lying in the ground plane - from behind and above
      // this reads as an arrow, where a cone just looked like a diamond
      const shape = new THREE.Shape();
      shape.moveTo(0, 2.6);          // the point
      shape.lineTo(-1.7, -1.5);
      shape.lineTo(0, -0.4);
      shape.lineTo(1.7, -1.5);
      shape.closePath();
      const arrowGeo = new THREE.ShapeGeometry(shape);
      arrowGeo.rotateX(Math.PI / 2);           // lay it flat, tip toward +z
      dirArrow = new THREE.Mesh(arrowGeo, new THREE.MeshBasicMaterial({
        color: 0x7ef0c0, transparent: true, opacity: 0.92,
        side: THREE.DoubleSide, depthWrite: false
      }));
      dirArrow.visible = false;
      scene.add(dirArrow);

      // the muzzle flash lives on the gun
      flashMesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.55, 6, 5),
        new THREE.MeshBasicMaterial({ color: 0xffe9a8, transparent: true, opacity: 0.95 })
      );
      flashMesh.position.set(1.25, 3.0, 2.2);
      flashMesh.visible = false;
      playerRig.add(flashMesh);

      // a health bar over every bot
      for (const rig of botRigs) {
        const bg = new THREE.Mesh(
          new THREE.PlaneGeometry(4.4, 0.62),
          new THREE.MeshBasicMaterial({ color: 0x1a1f2e, transparent: true, opacity: 0.8, depthWrite: false })
        );
        bg.position.y = 6.4;
        const fill = new THREE.Mesh(
          new THREE.PlaneGeometry(4.2, 0.42),
          new THREE.MeshBasicMaterial({ color: 0xff5c7a, transparent: true, opacity: 0.95, depthWrite: false })
        );
        fill.position.set(0, 6.4, 0.01);
        bg.visible = false; fill.visible = false;
        rig.add(bg); rig.add(fill);
        rig.userData.barBg = bg;
        rig.userData.barFill = fill;
      }
    }

    window.world3d = {
      ready: false,
      build(json) {
        buildTerrain(JSON.parse(json));
        buildActors();
        this.ready = true;
        ready3d = true;
      },
      frame(json) {
        if (!ready3d) return;
        const now = performance.now() / 1000;
        const dt = Math.min(0.05, Math.max(0.001, now - (lastT || now)));
        lastT = now;

        const st = JSON.parse(json);

        if (st.menu) {
          // a slow lap of the whole country, so the menu has a world behind it
          const a = now * 0.09;
          camera.position.set(WORLD.w / 2 + Math.cos(a) * 1250, 620,
                              WORLD.h / 2 + Math.sin(a) * 1250);
          camera.lookAt(WORLD.w / 2, 0, WORLD.h / 2);
          if (playerRig) playerRig.visible = false;
          if (dirArrow) dirArrow.visible = false;
          for (let i = 0; i < botRigs.length; i++) botRigs[i].visible = false;
          for (let i = 0; i < bulletPool.length; i++) bulletPool[i].visible = false;
          for (let i = 0; i < sparkPool.length; i++) sparkPool[i].visible = false;
          for (let i = 0; i < cratePool.length; i++) {
            cratePool[i].health.visible = false;
            cratePool[i].ammo.visible = false;
          }
          for (let i = 0; i < dmgPool.length; i++) dmgPool[i].sprite.visible = false;
          zoneMesh.visible = false;
          if (zoneRing) zoneRing.visible = false;
          renderer.render(scene, camera);
          return;
        }
        zoneMesh.visible = true;
        if (zoneRing) zoneRing.visible = true;

        const p = st.p;
        const speed = p[6] || 0;

        // ---- the soldier ----
        playerRig.visible = p[4] > 0;
        playerRig.position.set(p[0], p[1], p[2]);
        playerRig.rotation.y = p[3];
        const ud = playerRig.userData;
        ud.walk += speed * dt * 0.34;              // feet keep pace with the walk
        const swing = Math.min(1, speed / 11);
        playerRig.scale.set(1.3, 1.3 * (st.crouch ? 0.74 : 1), 1.3);
        if (ud.gun) {
          const wp = st.wp || 0;
          ud.gun.scale.set(wp ? 1.6 : 1, wp ? 1.35 : 1, wp ? 0.82 : 1);
        }
        ud.legs.rotation.x = Math.sin(ud.walk) * 0.62 * swing;
        ud.arms[0].rotation.x = -Math.sin(ud.walk) * 0.46 * swing;
        ud.arms[1].rotation.x = Math.sin(ud.walk) * 0.46 * swing;

        // ---- the direction arrow over our head ----
        if (dirArrow) {
          dirArrow.visible = p[4] > 0;
          dirArrow.position.set(p[0], p[1] + 9.6 + Math.sin(now * 3.2) * 0.35, p[2]);
          dirArrow.rotation.y = p[3];
          const pulse = 0.9 + Math.sin(now * 4.0) * 0.1;
          dirArrow.scale.set(pulse, pulse, pulse);
        }

        // ---- muzzle flash ----
        if (flashMesh) {
          if (flashTimer > 0) {
            flashTimer -= dt;
            flashMesh.visible = true;
            const t = 1 - Math.max(0, flashTimer) / 0.07;
            flashMesh.scale.setScalar(0.7 + t * 0.9);
            flashMesh.material.opacity = 0.95 * (1 - t);
          } else {
            flashMesh.visible = false;
          }
        }

        // ---- the bots ----
        for (let i = 0; i < botRigs.length; i++) {
          const rig = botRigs[i];
          const w = rig.userData;
          if (i >= st.b.length) { rig.visible = false; continue; }
          const b = st.b[i];
          const hp = b[4], dying = b[5];
          rig.visible = true;
          rig.position.set(b[0], b[1], b[2]);
          rig.rotation.y = b[3];

          if (dying > 0) {
            // topple over and fade away
            const t = Math.min(1, (1 - dying / 1.1) * 1.5);
            rig.rotation.x = -Math.PI / 2 * t;
            rig.traverse(function (o) {
              if (o.material && o.material.opacity !== undefined) {
                o.material.transparent = true;
                o.material.opacity = Math.max(0, dying / 1.1);
              }
            });
            w.opacity = 0;
            w.barBg.visible = false;
            w.barFill.visible = false;
          } else {
            rig.rotation.x = 0;
            if (w.opacity !== 1) {
              rig.traverse(function (o) {
                if (o.material && o.material.opacity !== undefined) {
                  o.material.opacity = 1;
                }
              });
              w.opacity = 1;
            }
            const flash = b[7] || 0;
            if (w.bodyMat) {
              w.bodyMat.emissive.setRGB(Math.min(1, flash * 4), 0, 0);
              w.bodyMat.color.setHex([0x8a3b3b, 0xa8402f, 0xc74b28][b[6] || 0]);
            }
            w.walk += dt * 7;
            w.legs.rotation.x = Math.sin(w.walk) * 0.4;
            const show = hp < 100;
            w.barBg.visible = show;
            w.barFill.visible = show;
            if (show) {
              // the bar has to fight its parent's rotation to face us
              const face = rig.quaternion.clone().invert().multiply(camera.quaternion);
              w.barBg.quaternion.copy(face);
              w.barFill.quaternion.copy(face);
              const frac = Math.max(0.03, hp / 100);
              w.barFill.scale.x = frac;
              w.barFill.position.x = -2.1 * (1 - frac);
            }
          }
        }

        // ---- bullets fly as streaks ----
        for (let i = 0; i < bulletPool.length; i++) {
          const m = bulletPool[i];
          if (i < st.s.length) {
            const s = st.s[i];
            m.visible = true;
            m.position.set(s[0], s[1], s[2]);
            m.rotation.y = Math.atan2(s[3], s[4]);
          } else {
            m.visible = false;
          }
        }

        // ---- sparks where shots landed ----
        for (let i = 0; i < sparkPool.length; i++) {
          const m = sparkPool[i];
          if (i < st.h.length) {
            const h = st.h[i];
            const life = Math.min(1, (h[3] || 0) / 0.45);
            m.visible = true;
            m.position.set(h[0], h[1], h[2]);
            m.material.opacity = life;
            m.scale.setScalar(0.5 + (1 - life) * 1.6);
          } else {
            m.visible = false;
          }
        }

        // ---- crates ----
        for (let i = 0; i < cratePool.length; i++) {
          const slot = cratePool[i];
          if (i < st.pk.length) {
            const k = st.pk[i];
            const m = k[3] ? slot.health : slot.ammo;
            slot.health.visible = false;
            slot.ammo.visible = false;
            m.visible = true;
            m.position.set(k[0], k[1] + Math.sin(now * 2.2 + i) * 0.28, k[2]);
            m.rotation.y = now * 0.7 + i;
          } else {
            slot.health.visible = false;
            slot.ammo.visible = false;
          }
        }

        // ---- floating damage numbers ----
        for (let i = 0; i < dmgPool.length; i++) {
          const d = dmgPool[i];
          if (i < st.dn.length) {
            const e = st.dn[i];
            if (d.last !== e[3]) {
              d.last = e[3];
              const c2 = d.canvas.getContext("2d");
              c2.clearRect(0, 0, 128, 64);
              c2.font = "bold 46px system-ui, sans-serif";
              c2.textAlign = "center";
              c2.textBaseline = "middle";
              c2.lineWidth = 7;
              c2.strokeStyle = "rgba(0,0,0,0.8)";
              c2.strokeText(e[3], 64, 34);
              c2.fillStyle = "#ffe08a";
              c2.fillText(e[3], 64, 34);
              d.tex.needsUpdate = true;
            }
            d.sprite.visible = true;
            d.sprite.position.set(e[0], e[1], e[2]);
          } else {
            d.sprite.visible = false;
          }
        }

        // ---- footstep dust ----
        dustTimer -= dt;
        if (speed > 3 && dustTimer <= 0) {
          dustTimer = 0.17;
          for (let i = 0; i < dustPool.length; i++) {
            if (dustPool[i].life <= 0) {
              dustPool[i].life = 0.55;
              dustPool[i].mesh.position.set(p[0], p[1] + 0.3, p[2]);
              dustPool[i].mesh.visible = true;
              break;
            }
          }
        }
        for (let i = 0; i < dustPool.length; i++) {
          const d = dustPool[i];
          if (d.life > 0) {
            d.life -= dt;
            const t = 1 - Math.max(0, d.life) / 0.55;
            d.mesh.scale.setScalar(0.5 + t * 1.7);
            d.mesh.material.opacity = 0.32 * (1 - t);
            d.mesh.position.y += dt * 0.9;
            if (d.life <= 0) d.mesh.visible = false;
          }
        }

        // ---- the zone breathes ----
        const z = st.z;
        zoneMesh.position.x = z[0];
        zoneMesh.position.z = z[1];
        zoneMesh.scale.set(z[2], 1, z[2]);
        zoneMesh.material.opacity = 0.34 + Math.sin(now * 2.1) * 0.07;
        if (zoneRing) {
          zoneRing.position.x = z[0];
          zoneRing.position.z = z[1];
          zoneRing.scale.set(z[2], 1, z[2]);
          zoneRing.material.opacity = 0.42 + Math.sin(now * 3.1) * 0.16;
        }

        // ---- the sea moves a little ----
        if (waterMesh) waterMesh.position.y = WORLD.water + Math.sin(now * 1.3) * 0.13;

        // ---- camera: behind, eased, and bobbing as you run ----
        const yaw = st.cam[0], pitch = st.cam[1];
        const height = 7.4 + pitch * 14;
        let dist = 17;
        let cx = 0, cz = 0;
        for (let attempt = 0; attempt < 2; attempt++) {
          cx = p[0] - Math.sin(yaw) * dist;
          cz = p[2] - Math.cos(yaw) * dist;
          let hitsSomething = false;
          for (let k = 0; k < treePos.length; k++) {
            const t = treePos[k];
            const dx = t.x - cx, dz = t.z - cz;
            if (dx * dx + dz * dz < 16) { hitsSomething = true; break; }
          }
          if (!hitsSomething) {
            for (let k = 0; k < blockPos.length; k++) {
              const t = blockPos[k];
              const dx = t.x - cx, dz = t.z - cz;
              const rr = t.r + 4;
              if (dx * dx + dz * dz < rr * rr) { hitsSomething = true; break; }
            }
          }
          if (!hitsSomething) break;
          dist = Math.max(12.5, dist * 0.80);
        }
        const bob = speed > 2 ? Math.sin(now * 9.5) * 0.30 * Math.min(1, speed / 13) : 0;
        const want = new THREE.Vector3(cx, p[1] + height + bob, cz);
        if (!camSmooth) camSmooth = want.clone();
        camSmooth.lerp(want, Math.min(1, dt * 9));
        camera.position.copy(camSmooth);
        camera.lookAt(p[0] + Math.sin(yaw) * 14, p[1] + 4.2, p[2] + Math.cos(yaw) * 14);

        // ---- screen shake and the sprint FOV kick ----
        const sh = st.sh || 0;
        if (sh > 0.01) {
          camera.position.x += (Math.random() - 0.5) * sh * 2.4;
          camera.position.y += (Math.random() - 0.5) * sh * 2.4;
        }
        const wantFov = 62 + (speed > 13 ? 5 : 0);
        fovNow += (wantFov - fovNow) * Math.min(1, dt * 4);
        if (Math.abs(camera.fov - fovNow) > 0.02) {
          camera.fov = fovNow;
          camera.updateProjectionMatrix();
        }

        sunLight.position.set(p[0] - 120, 260, p[2] - 80);
        sunLight.target.position.set(p[0], p[1], p[2]);
        sunLight.target.updateMatrixWorld();

        renderer.render(scene, camera);
      },
      flash() { flashTimer = 0.07; },
      resize(w, h) {
        if (!renderer) return;
        renderer.setSize(w, h, false);
        camera.aspect = w / Math.max(1, h);
        camera.updateProjectionMatrix();
      }
    };

    /* ==================================================================
       Input
         phone  - a stick wherever your left thumb lands, look on the right,
                  a big FIRE button bottom-right
         laptop - WASD, move the mouse to look, click or Space to fire
       ================================================================== */
    let tapFn = null, primaryFn = null, moveFn = null, lookFn = null, fireFn = null,
        stickFn = null, drawFn = null, updateFn = null, sendFn = null, sizeFn = null,
        sprintFn = null, crouchFn = null, reloadFn = null, swapFn = null, pauseFn = null,
        pyodide = null, running = false, playing = false, crouchOn = false;

    const keys = {};
    let stickId = null, stickOX = 0, stickOY = 0, stickX = 0, stickY = 0;
    let lookId = null, lookX = 0, lookY = 0;
    let firingTouch = false, firingKey = false, firingMouse = false;
    let locked = false;

    function cssSize() {
      return { w: screenBox.clientWidth, h: screenBox.clientHeight };
    }

    function resizeAll() {
      const { w, h } = cssSize();
      if (!w || !h) return;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      gameCanvas.style.width = w + "px";
      gameCanvas.style.height = h + "px";
      hudCanvas.style.width = w + "px";
      hudCanvas.style.height = h + "px";
      hudCanvas.width = Math.floor(w * dpr);
      hudCanvas.height = Math.floor(h * dpr);
      if (window.world3d && window.world3d.resize) window.world3d.resize(w, h);
      if (sizeFn) sizeFn(w, h);
    }

    function fireCentre() {
      const s = cssSize();
      return { x: s.w - 104, y: s.h - 104, r: 64 };
    }
    function pushMove() { if (moveFn) moveFn(stickX, stickY); }
    function pushFire() { if (fireFn) fireFn(firingTouch || firingKey || firingMouse); }
    function pushStick(cx, cy, on) { if (stickFn) stickFn(cx, cy, on); }

    // Python tells us when a round is on, so the menus keep a normal cursor
    window.openArcade = function () {
      window.location.href = "../../";
    };

    window.set_playing = function (on) {
      playing = !!on;
      if (!playing) {
        firingTouch = firingKey = firingMouse = false;
        stickId = lookId = null;
        stickX = stickY = 0;
        crouchOn = false;
        camSmooth = null;
        pushMove(); pushFire(); pushStick(0, 0, false);
        if (document.pointerLockElement) document.exitPointerLock();
      }
    };

    function localPoint(e) {
      const r = gameCanvas.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }

    gameCanvas.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      audio();
      const p = localPoint(e);
      const wasPlaying = playing;

      // the menus live in Python - always give it the click first
      if (tapFn) tapFn(p.x, p.y);
      if (!wasPlaying) return;      // that click started a round, nothing else

      if (e.pointerType === "mouse") {
        if (!document.pointerLockElement) {
          try { gameCanvas.requestPointerLock(); } catch (err) {}
          lookId = e.pointerId; lookX = p.x; lookY = p.y;   // fallback drag
          return;
        }
        firingMouse = true; pushFire();
        return;
      }

      const fc = fireCentre();
      if (Math.hypot(p.x - fc.x, p.y - fc.y) < fc.r + 20) {
        firingTouch = true; pushFire();
        return;
      }
      if (p.x < cssSize().w * 0.5) {
        // a stick right where the thumb landed
        stickId = e.pointerId; stickOX = p.x; stickOY = p.y;
        stickX = stickY = 0;
        pushMove(); pushStick(p.x, p.y, true);
        return;
      }
      lookId = e.pointerId; lookX = p.x; lookY = p.y;
    });

    gameCanvas.addEventListener("pointermove", (e) => {
      const p = localPoint(e);
      if (e.pointerId === stickId) {
        const dx = p.x - stickOX, dy = p.y - stickOY;
        const m = Math.hypot(dx, dy) || 1;
        const k = Math.min(1, m / 62) / m;
        stickX = dx * k;
        stickY = -dy * k;
        pushMove();
      } else if (e.pointerId === lookId && !locked) {
        if (lookFn) lookFn((p.x - lookX) * 0.006, (p.y - lookY) * 0.004);
        lookX = p.x; lookY = p.y;
      }
    });

    function endPointer(e) {
      if (e.pointerId === stickId) {
        stickId = null; stickX = stickY = 0;
        pushMove(); pushStick(0, 0, false);
      } else if (e.pointerId === lookId) {
        lookId = null;
      } else if (firingTouch) {
        firingTouch = false; pushFire();
      }
    }
    gameCanvas.addEventListener("pointerup", endPointer);
    gameCanvas.addEventListener("pointercancel", endPointer);
    gameCanvas.addEventListener("contextmenu", (e) => e.preventDefault());

    // mouse look, once the pointer is locked
    document.addEventListener("pointerlockchange", () => {
      locked = document.pointerLockElement === gameCanvas;
    });
    document.addEventListener("mousemove", (e) => {
      if (!locked || !lookFn) return;
      lookFn(e.movementX * 0.0024, e.movementY * 0.0018);
    });
    document.addEventListener("mouseup", () => {
      if (firingMouse) { firingMouse = false; pushFire(); }
    });

    // a real keyboard
    window.addEventListener("keydown", (e) => {
      if (e.repeat) return;
      const k = e.key.toLowerCase();
      if (["w", "a", "s", "d", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) {
        keys[k] = true; updateKeys();
        e.preventDefault();
      } else if (k === " " || k === "enter") {
        if (!playing) {
          if (primaryFn) primaryFn();
        } else {
          firingKey = true; pushFire();
        }
        e.preventDefault();
      } else if (playing) {
        if (k === "shift") { if (sprintFn) sprintFn(true); e.preventDefault(); }
        else if (k === "c") { if (crouchFn) crouchFn(!crouchOn); crouchOn = !crouchOn; e.preventDefault(); }
        else if (k === "r") { if (reloadFn) reloadFn(); e.preventDefault(); }
        else if (k === "q") { if (swapFn) swapFn(); e.preventDefault(); }
        else if (k === "p") { if (pauseFn) pauseFn(true); e.preventDefault(); }
      }
    });
    window.addEventListener("keyup", (e) => {
      const k = e.key.toLowerCase();
      if (keys[k]) { keys[k] = false; updateKeys(); }
      if (k === " " || k === "enter") { firingKey = false; pushFire(); }
      if (k === "shift" && sprintFn) sprintFn(false);
    });

    function updateKeys() {
      let x = 0, y = 0;
      if (keys["a"] || keys["arrowleft"]) x -= 1;
      if (keys["d"] || keys["arrowright"]) x += 1;
      if (keys["w"] || keys["arrowup"]) y += 1;
      if (keys["s"] || keys["arrowdown"]) y -= 1;
      const m = Math.hypot(x, y);
      if (m > 0) { x /= m; y /= m; }
      stickX = x; stickY = y;
      pushMove();
    }

    // the HUD is a 2D canvas on top, so clicks there must reach the game too
    hudCanvas.style.pointerEvents = "none";

    /* ==================================================================
       Boot
       ================================================================== */
    function initThree() {
      renderer = new THREE.WebGLRenderer({ canvas: gameCanvas, antialias: true });
      renderer.setPixelRatio(1);
      renderer.setSize(cssSize().w || 800, cssSize().h || 500, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      scene = new THREE.Scene();
      scene.background = skyTexture();
      scene.fog = new THREE.Fog(0xbcd9ef, 600, 2400);

      camera = new THREE.PerspectiveCamera(62, 1.6, 0.5, 5000);
      camera.position.set(0, 60, 0);

      const hemi = new THREE.HemisphereLight(0xdff0ff, 0x50603f, 1.15);
      scene.add(hemi);
      sunLight = new THREE.DirectionalLight(0xfff3d6, 1.55);
      sunLight.position.set(-120, 260, -80);
      scene.add(sunLight);
      scene.add(sunLight.target);
    }

    async function boot() {
      const msg = document.getElementById("loader-msg");
      const bar = document.getElementById("loader-bar");

      msg.textContent = "Building the world…";
      bar.style.width = "20%";
      initThree();

      msg.textContent = "Downloading the Python runtime…";
      bar.style.width = "35%";
      pyodide = await loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/" });

      bar.style.width = "60%";
      msg.textContent = "Loading game.py…";
      const src = await (await fetch("game.py", { cache: "no-store" })).text();
      await pyodide.runPythonAsync(src);

      tapFn = pyodide.globals.get("tap");
      primaryFn = pyodide.globals.get("press_primary");
      moveFn = pyodide.globals.get("set_move");
      lookFn = pyodide.globals.get("set_look");
      fireFn = pyodide.globals.get("set_fire");
      drawFn = pyodide.globals.get("draw");
      updateFn = pyodide.globals.get("update");
      sendFn = pyodide.globals.get("send_frame");
      sizeFn = pyodide.globals.get("set_size");
      stickFn = pyodide.globals.get("set_stick");
      sprintFn = pyodide.globals.get("set_sprint");
      crouchFn = pyodide.globals.get("set_crouch");
      reloadFn = pyodide.globals.get("set_reload");
      swapFn = pyodide.globals.get("set_swap");
      pauseFn = pyodide.globals.get("set_pause");
      try {
        pyodide.globals.get("set_touch_ui")(
          window.matchMedia("(pointer: coarse)").matches || "ontouchstart" in window);
      } catch (e) {}

      bar.style.width = "82%";
      msg.textContent = "Shaping the map…";
      await new Promise(r => setTimeout(r, 30));
      pyodide.globals.get("build_world")();

      resizeAll();
      running = true;
      bar.style.width = "100%";
      document.getElementById("loader").classList.add("is-hidden");

      let last = performance.now();
      function loop(now) {
        const dt = (now - last) / 1000;
        last = now;
        if (running) {
          updateFn(dt);
          sendFn();
          drawFn();
        }
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    }

    document.getElementById("mute").addEventListener("click", (e) => {
      muted = !muted;
      document.getElementById("mute-icon").innerHTML = muted ? "&#128263;" : "&#128266;";
      e.currentTarget.setAttribute("aria-pressed", String(muted));
      e.currentTarget.blur();
    });

    (function fullscreen() {
      const stage = document.querySelector(".stage");
      const btn = document.getElementById("fs");
      function mark(on) {
        btn.innerHTML = on ? "&#10064;" : "&#9974;";
        btn.setAttribute("aria-pressed", String(on));
        document.documentElement.classList.toggle("fs-on", on);
        setTimeout(resizeAll, 80);
      }
      btn.addEventListener("click", (e) => {
        e.preventDefault(); btn.blur();
        if (document.fullscreenElement) { document.exitFullscreen(); return; }
        if (stage.requestFullscreen) {
          const p = stage.requestFullscreen({ navigationUI: "hide" });
          if (p && p.then) p.then(() => {
            mark(true);
            try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(() => {}); } catch (er) {}
          }, () => mark(true));
          else mark(true);
        } else mark(true);
      });
      document.addEventListener("fullscreenchange", () => mark(!!document.fullscreenElement));
      mark(false);
    })();

    window.addEventListener("resize", resizeAll);
    window.addEventListener("orientationchange", () => setTimeout(resizeAll, 120));

    boot().catch((err) => {
      document.getElementById("loader-msg").textContent = "Could not start the game: " + err;
      console.error(err);
    });
  </script>
</body>
</html>
