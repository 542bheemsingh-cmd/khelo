<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1224">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Khelo Fly - a Flappy-Bird-style 2D game written in Python and played in the browser.">
  <title>Khelo Fly - Python 2D Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-orient="portrait">
  <main class="stage">
    <div class="bar">
      <a class="ctrl home" href="../../" title="All games" aria-label="All games">&#8962;</a>
      <span class="grow"></span>
      <button id="mute" class="ctrl" type="button" aria-pressed="false" title="Toggle sound" aria-label="Toggle sound">
        <span id="mute-icon" aria-hidden="true">&#128266;</span>
      </button>
      <button id="fs" class="ctrl" type="button" aria-pressed="false" title="Full screen" aria-label="Full screen">&#9974;</button>
    </div>

    <div class="screen">
      <canvas id="game" width="480" height="720" aria-label="Khelo Fly game"></canvas>

      <div id="loader" class="loader">
        <div class="loader-card">
          <h1>KHELO<span>FLY</span></h1>
          <p id="loader-msg">Starting up…</p>
          <div class="bar-track"><i id="loader-bar"></i></div>
          <p class="loader-note">A Python game running in your browser via Pyodide.</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Pyodide turns Python into WebAssembly so the game runs with no server. -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
  <script>
    var GW = 480, GH = 720;   // the canvas's fixed drawing resolution

    // ---------------------------------------------------------------------
    // Helpers exposed to Python: sound + small bits of browser glue.
    // ---------------------------------------------------------------------
    var actx = null;
    var muted = false;

    window.playSound = function (name) {
      if (muted) return;
      try {
        actx = actx || new (window.AudioContext || window.webkitAudioContext)();
        if (actx.state === "suspended") actx.resume();

        var cfg = {
          flap:  { type: "square",   f0: 520, f1: 900,  dur: 0.12, vol: 0.07 },
          score: { type: "triangle", f0: 880, f1: 1320, dur: 0.14, vol: 0.09 },
          hit:   { type: "sawtooth", f0: 300, f1: 80,   dur: 0.30, vol: 0.10 }
        }[name] || { type: "sine", f0: 440, f1: 440, dur: 0.10, vol: 0.05 };

        var t = actx.currentTime;
        var osc = actx.createOscillator();
        var gain = actx.createGain();
        osc.connect(gain);
        gain.connect(actx.destination);

        osc.type = cfg.type;
        osc.frequency.setValueAtTime(cfg.f0, t);
        osc.frequency.exponentialRampToValueAtTime(Math.max(1, cfg.f1), t + cfg.dur);
        gain.gain.setValueAtTime(cfg.vol, t);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + cfg.dur);

        osc.start(t);
        osc.stop(t + cfg.dur + 0.02);
      } catch (err) {
        /* Audio is a nicety; never let it stop the game. */
      }
    };

    // ---------------------------------------------------------------------
    // Boot: load Pyodide, run game.py, then drive the loop from here.
    // ---------------------------------------------------------------------
    var flap = null;
    var ready = false;
    var canvas = document.getElementById("game");
    var screenBox = document.querySelector(".screen");
    var setUiFn = null;
    var muteButton = document.getElementById("mute");

    /* Keep the 480x720 drawing ratio exact so nothing is squashed or cropped,
       whatever the screen. */
    function fit() {
      var aw = screenBox.clientWidth, ah = screenBox.clientHeight;
      if (!aw || !ah) return;
      var s = Math.min(aw / GW, ah / GH);
      canvas.style.width = Math.floor(GW * s) + "px";
      canvas.style.height = Math.floor(GH * s) + "px";
      if (setUiFn) setUiFn(s);      // tell Python how small the canvas is
    }

    async function boot() {
      var msg = document.getElementById("loader-msg");
      var bar = document.getElementById("loader-bar");

      msg.textContent = "Downloading the Python runtime…";
      var pyodide = await loadPyodide({
        indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/"
      });

      bar.style.width = "65%";
      msg.textContent = "Loading game.py…";

      var source = await (await fetch("game.py", { cache: "no-store" })).text();
      await pyodide.runPythonAsync(source);

      var update = pyodide.globals.get("update");
      var draw = pyodide.globals.get("draw");
      flap = pyodide.globals.get("flap");
      setUiFn = pyodide.globals.get("set_ui");

      bar.style.width = "100%";
      ready = true;
      document.getElementById("loader").classList.add("is-hidden");
      fit();

      var last = performance.now();
      function frame(now) {
        var dt = (now - last) / 1000;
        last = now;
        update(dt);
        draw();
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    // ---------------------------------------------------------------------
    // Input: keyboard + pointer (covers mouse and touch).
    // ---------------------------------------------------------------------
    function triggerFlap(event) {
      if (event && event.cancelable) event.preventDefault();
      if (ready && flap) flap();
    }

    window.addEventListener("keydown", function (event) {
      if (event.target === muteButton) return;
      if (event.code === "Space" || event.code === "ArrowUp" || event.code === "KeyW") {
        triggerFlap(event);
      }
    });

    canvas.addEventListener("pointerdown", triggerFlap);
    canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

    muteButton.addEventListener("click", function () {
      muted = !muted;
      document.getElementById("mute-icon").innerHTML = muted ? "&#128263;" : "&#128266;";
      muteButton.setAttribute("aria-pressed", String(muted));
      muteButton.blur();
    });

    /* ---- full screen ---- */
    (function () {
      var stage = document.querySelector(".stage");
      var btn = document.getElementById("fs");

      function mark(on) {
        btn.innerHTML = on ? "&#10064;" : "&#9974;";
        btn.setAttribute("aria-pressed", String(on));
        btn.title = on ? "Exit full screen" : "Full screen";
        document.documentElement.classList.toggle("fs-on", on);
        setTimeout(fit, 60);
      }

      btn.addEventListener("click", function (e) {
        e.preventDefault();
        btn.blur();
        if (document.fullscreenElement) { document.exitFullscreen(); return; }
        if (stage.requestFullscreen) {
          var p = stage.requestFullscreen({ navigationUI: "hide" });
          if (p && p.then) p.then(function () { mark(true); }, function () { mark(true); });
        } else {
          mark(true);   // iOS Safari has no element fullscreen: fill the viewport instead
        }
      });

      document.addEventListener("fullscreenchange", function () {
        mark(!!document.fullscreenElement);
      });
      mark(false);
    })();

    window.addEventListener("resize", fit);
    window.addEventListener("orientationchange", fit);
    document.addEventListener("fullscreenchange", fit);

    boot().catch(function (err) {
      document.getElementById("loader-msg").textContent =
        "Could not start the game: " + err;
      console.error(err);
    });
  </script>
</body>
</html>
