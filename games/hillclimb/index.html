<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1224">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Khelo Climb - a 2D hill-climb driving game written in Python: levels, vehicles, coins, fuel and obstacles.">
  <title>Khelo Climb - Python 2D Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-orient="landscape">
  <main class="stage">
    <div class="bar">
      <a class="ctrl home" href="../../" title="All games" aria-label="All games">&#8962;</a>
      <span class="grow"></span>
      <button id="mute" class="ctrl" type="button" aria-pressed="false" title="Toggle sound" aria-label="Toggle sound">
        <span id="mute-icon" aria-hidden="true">&#128266;</span>
      </button>
      <button id="fs" class="ctrl" type="button" aria-pressed="false" title="Full screen" aria-label="Full screen">&#9974;</button>
    </div>

    <div class="screen">
      <canvas id="game" width="900" height="560" aria-label="Khelo Climb game"></canvas>

      <div class="pedals is-hidden" id="pedals">
        <button class="pedal brake" id="pedal-brake" type="button" aria-label="Brake"><span>BRAKE</span></button>
        <button class="pedal gas" id="pedal-gas" type="button" aria-label="Gas"><span>GAS</span></button>
      </div>

      <div class="rotate" id="rotate">
        <div class="rotate-card">
          <div class="rotate-icon" aria-hidden="true">&#128241;&#8635;</div>
          <h2>Turn your phone sideways</h2>
          <p>Khelo Climb plays best in landscape. Rotate your device, or carry on in portrait.</p>
          <button type="button" id="rotate-dismiss">Play anyway</button>
        </div>
      </div>

      <div id="loader" class="loader">
        <div class="loader-card">
          <h1>KHELO<span>CLIMB</span></h1>
          <p id="loader-msg">Starting up…</p>
          <div class="bar-track"><i id="loader-bar"></i></div>
          <p class="loader-note">A Python game running in your browser via Pyodide.</p>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
  <script>
    var GW = 900, GH = 560;

    var actx = null;
    var muted = false;

    window.playSound = function (name) {
      if (muted) return;
      try {
        actx = actx || new (window.AudioContext || window.webkitAudioContext)();
        if (actx.state === "suspended") actx.resume();
        var cfg = {
          start:  { type: "square",   f0: 180, f1: 420, dur: 0.30, vol: 0.06 },
          crash:  { type: "sawtooth", f0: 260, f1: 60,  dur: 0.40, vol: 0.10 },
          coin:   { type: "triangle", f0: 1100, f1: 1760, dur: 0.12, vol: 0.08 },
          refuel: { type: "sine",     f0: 420, f1: 880, dur: 0.22, vol: 0.08 },
          win:    { type: "triangle", f0: 660, f1: 1320, dur: 0.35, vol: 0.09 },
          click:  { type: "square",   f0: 640, f1: 640, dur: 0.05, vol: 0.05 },
          buy:    { type: "triangle", f0: 520, f1: 1040, dur: 0.25, vol: 0.09 },
          deny:   { type: "sawtooth", f0: 220, f1: 140, dur: 0.18, vol: 0.07 }
        }[name] || { type: "sine", f0: 300, f1: 300, dur: 0.1, vol: 0.05 };
        var t = actx.currentTime;
        var osc = actx.createOscillator();
        var gain = actx.createGain();
        osc.connect(gain); gain.connect(actx.destination);
        osc.type = cfg.type;
        osc.frequency.setValueAtTime(cfg.f0, t);
        osc.frequency.exponentialRampToValueAtTime(Math.max(1, cfg.f1), t + cfg.dur);
        gain.gain.setValueAtTime(cfg.vol, t);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + cfg.dur);
        osc.start(t); osc.stop(t + cfg.dur + 0.02);
      } catch (err) { /* audio is optional */ }
    };

    var gasFn = null, brakeFn = null, tapFn = null, enterFn = null, menuFn = null, playingFn = null;
    var ready = false;
    var canvas = document.getElementById("game");
    var screenBox = document.querySelector(".screen");
    var setUiFn = null;
    var pedals = document.getElementById("pedals");

    /* Keep the 900x560 drawing ratio exact so taps map 1:1 and nothing is
       squashed or cropped, whatever the screen. */
    function fit() {
      var aw = screenBox.clientWidth, ah = screenBox.clientHeight;
      if (!aw || !ah) return;
      var s = Math.min(aw / GW, ah / GH);
      canvas.style.width = Math.floor(GW * s) + "px";
      canvas.style.height = Math.floor(GH * s) + "px";
      if (setUiFn) setUiFn(s);      // tell Python how small the canvas is
      pedals.style.width = Math.floor(GW * s) + "px";   // keep the pedals on the canvas
    }

    async function boot() {
      var msg = document.getElementById("loader-msg");
      var bar = document.getElementById("loader-bar");

      msg.textContent = "Downloading the Python runtime…";
      var pyodide = await loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/" });

      bar.style.width = "65%";
      msg.textContent = "Loading game.py…";
      var source = await (await fetch("game.py", { cache: "no-store" })).text();
      await pyodide.runPythonAsync(source);

      var update = pyodide.globals.get("update");
      var draw = pyodide.globals.get("draw");
      gasFn = pyodide.globals.get("gas");
      brakeFn = pyodide.globals.get("brake");
      tapFn = pyodide.globals.get("tap");
      enterFn = pyodide.globals.get("enter_key");
      menuFn = pyodide.globals.get("back_to_menu");
      playingFn = pyodide.globals.get("playing");
      setUiFn = pyodide.globals.get("set_ui");

      bar.style.width = "100%";
      ready = true;
      document.getElementById("loader").classList.add("is-hidden");
      fit();

      var last = performance.now();
      function frame(now) {
        var dt = (now - last) / 1000;
        last = now;
        update(dt);
        draw();
        // pedals only make sense while actually driving
        pedals.classList.toggle("is-hidden", !playingFn());
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    function setGas(on) { if (ready && gasFn) gasFn(on); }
    function setBrake(on) { if (ready && brakeFn) brakeFn(on); }

    // ---- keyboard ----
    window.addEventListener("keydown", function (e) {
      if (e.code === "ArrowRight" || e.code === "KeyD") { setGas(true); e.preventDefault(); }
      if (e.code === "ArrowLeft" || e.code === "KeyA") { setBrake(true); e.preventDefault(); }
      if (e.code === "Enter" || e.code === "Space") { if (ready && enterFn) enterFn(); e.preventDefault(); }
      if (e.code === "Escape") { if (ready && menuFn) menuFn(); }
    });
    window.addEventListener("keyup", function (e) {
      if (e.code === "ArrowRight" || e.code === "KeyD") setGas(false);
      if (e.code === "ArrowLeft" || e.code === "KeyA") setBrake(false);
    });

    // ---- canvas taps (menu buttons) ----
    function canvasPoint(e) {
      var r = canvas.getBoundingClientRect();
      return [ (e.clientX - r.left) / r.width * GW,
               (e.clientY - r.top) / r.height * GH ];
    }
    canvas.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      if (!ready || !tapFn) return;
      var p = canvasPoint(e);
      tapFn(p[0], p[1]);
    });
    canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

    // ---- pedals ----
    function bindPedal(el, fn) {
      el.addEventListener("pointerdown", function (e) { e.preventDefault(); el.classList.add("is-down"); fn(true); });
      var release = function () { el.classList.remove("is-down"); fn(false); };
      el.addEventListener("pointerup", release);
      el.addEventListener("pointercancel", release);
      el.addEventListener("pointerleave", release);
    }
    bindPedal(document.getElementById("pedal-gas"), setGas);
    bindPedal(document.getElementById("pedal-brake"), setBrake);

    document.getElementById("mute").addEventListener("click", function (e) {
      muted = !muted;
      document.getElementById("mute-icon").innerHTML = muted ? "&#128263;" : "&#128266;";
      e.currentTarget.setAttribute("aria-pressed", String(muted));
      e.currentTarget.blur();
    });

    /* ---- full screen ---- */
    (function () {
      var stage = document.querySelector(".stage");
      var btn = document.getElementById("fs");
      var wide = document.body.dataset.orient === "landscape";

      function mark(on) {
        btn.innerHTML = on ? "&#10064;" : "&#9974;";
        btn.setAttribute("aria-pressed", String(on));
        btn.title = on ? "Exit full screen" : "Full screen";
        document.documentElement.classList.toggle("fs-on", on);
        setTimeout(fit, 60);
      }
      function lockLandscape() {
        try {
          if (wide && screen.orientation && screen.orientation.lock) {
            var p = screen.orientation.lock("landscape");
            if (p && p.catch) p.catch(function () {});
          }
        } catch (e) {}
      }
      btn.addEventListener("click", function (e) {
        e.preventDefault();
        btn.blur();
        if (document.fullscreenElement) { document.exitFullscreen(); return; }
        if (stage.requestFullscreen) {
          var p = stage.requestFullscreen({ navigationUI: "hide" });
          if (p && p.then) p.then(lockLandscape, function () { mark(true); });
          else lockLandscape();
        } else {
          mark(true);   // iOS Safari has no element fullscreen: fill the viewport instead
        }
      });
      document.addEventListener("fullscreenchange", function () {
        if (!document.fullscreenElement && screen.orientation && screen.orientation.unlock) {
          try { screen.orientation.unlock(); } catch (e) {}
        }
        mark(!!document.fullscreenElement);
      });
      mark(false);
    })();

    /* ---- rotate hint ---- */
    (function () {
      var box = document.getElementById("rotate");
      var btn = document.getElementById("rotate-dismiss");
      function dismissed() {
        try { return sessionStorage.getItem("khelo_rotate_ok") === "1"; } catch (e) { return false; }
      }
      function portrait() {
        return window.matchMedia("(orientation: portrait) and (max-width: 900px)").matches;
      }
      function update() {
        box.classList.toggle("is-on", portrait() && !dismissed() && !document.fullscreenElement);
      }
      btn.addEventListener("click", function () {
        try { sessionStorage.setItem("khelo_rotate_ok", "1"); } catch (e) {}
        update();
      });
      window.addEventListener("resize", update);
      window.addEventListener("orientationchange", update);
      document.addEventListener("fullscreenchange", update);
      update();
    })();

    window.addEventListener("resize", fit);
    window.addEventListener("orientationchange", fit);
    document.addEventListener("fullscreenchange", fit);

    boot().catch(function (err) {
      document.getElementById("loader-msg").textContent = "Could not start the game: " + err;
      console.error(err);
    });
  </script>
</body>
</html>
