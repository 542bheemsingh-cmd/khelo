<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1224">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Khelo Ludo - the classic board game written in Python and played in the browser.">
  <title>Khelo Ludo - Python Board Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-orient="landscape">
  <main class="stage">
    <div class="bar">
      <a class="ctrl home" href="../../" title="All games" aria-label="All games">&#8962;</a>
      <span class="grow"></span>
      <button id="mute" class="ctrl" type="button" aria-pressed="false" title="Toggle sound" aria-label="Toggle sound">
        <span id="mute-icon" aria-hidden="true">&#128266;</span>
      </button>
      <button id="fs" class="ctrl" type="button" aria-pressed="false" title="Full screen" aria-label="Full screen">&#9974;</button>
    </div>

    <div class="screen">
      <canvas id="game" width="900" height="560" aria-label="Khelo Ludo"></canvas>

      <!-- the text field the canvas borrows when a player types their name -->
      <input id="namebox" class="namebox" type="text" maxlength="12"
             autocomplete="off" autocapitalize="words" spellcheck="false"
             aria-label="Player name" tabindex="-1">

      <div class="rotate" id="rotate">
        <div class="rotate-card">
          <div class="rotate-icon" aria-hidden="true">&#128241;&#8635;</div>
          <h2>Turn your phone sideways</h2>
          <p>Khelo Ludo plays best in landscape. Rotate your device, or carry on in portrait.</p>
          <button type="button" id="rotate-dismiss">Play anyway</button>
        </div>
      </div>

      <div id="loader" class="loader">
        <div class="loader-card">
          <h1>KHELO<span>LUDO</span></h1>
          <p id="loader-msg">Starting up…</p>
          <div class="bar-track"><i id="loader-bar"></i></div>
          <p class="loader-note">A Python game running in your browser via Pyodide.</p>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
  <script>
    var GW = 900, GH = 560;   // the canvas's fixed drawing resolution

    /* ------------------------------------------------------------------
       Sound: everything is synthesised, so there are no audio files to load.
       ------------------------------------------------------------------ */
    var actx = null, muted = false, noiseBuf = null;

    function audio() {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
      return actx;
    }

    function noiseSource() {
      if (noiseBuf) return noiseBuf;
      var n = Math.floor(actx.sampleRate * 0.6);
      noiseBuf = actx.createBuffer(1, n, actx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      return noiseBuf;
    }

    // a burst of filtered noise - clacks, rattles, thuds
    function noise(dur, vol, freq, q, when, type) {
      var t = when || actx.currentTime;
      var src = actx.createBufferSource();
      src.buffer = noiseSource();
      var f = actx.createBiquadFilter();
      f.type = type || "bandpass";
      f.frequency.value = freq;
      f.Q.value = q || 1;
      var g = actx.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f); f.connect(g); g.connect(actx.destination);
      src.start(t);
      src.stop(t + dur + 0.02);
    }

    // a short pitched blip with a quick attack
    function tone(f0, f1, dur, type, vol, when) {
      var t = when || actx.currentTime;
      var o = actx.createOscillator();
      var g = actx.createGain();
      o.type = type || "sine";
      o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t);
      o.stop(t + dur + 0.03);
    }

    window.playSound = function (name) {
      if (muted) return;
      try {
        audio();
        var t = actx.currentTime, i, k;
        switch (name) {
          case "dice":
            // the rattle of a die shaking in the hand...
            for (i = 0; i < 10; i++) {
              noise(0.035, 0.055, 1500 + Math.random() * 1600, 6, t + i * 0.058);
            }
            // ...and the heavier clack as it lands on the board
            noise(0.10, 0.11, 650, 2.5, t + 0.66);
            tone(240, 95, 0.15, "sine", 0.10, t + 0.66);
            noise(0.06, 0.05, 2400, 5, t + 0.74);
            break;
          case "hop":
            // a wooden tock, like a counter tapped on a board
            tone(360, 200, 0.085, "triangle", 0.11);
            noise(0.028, 0.05, 2800, 9);
            break;
          case "capture":
            // a whoosh as it is knocked back, then a thud
            tone(760, 150, 0.30, "sawtooth", 0.085);
            noise(0.22, 0.075, 900, 2, t + 0.14);
            tone(160, 60, 0.24, "sine", 0.11, t + 0.20);
            break;
          case "home":
            tone(880, 880, 0.16, "triangle", 0.095);
            tone(1320, 1320, 0.24, "triangle", 0.08, t + 0.09);
            break;
          case "win":
            var notes = [523, 659, 784, 1047, 1319];
            for (k = 0; k < notes.length; k++) {
              tone(notes[k], notes[k], 0.28, "triangle", 0.09, t + k * 0.13);
            }
            noise(0.6, 0.045, 3200, 1, t + 0.62);
            break;
          case "click":
            tone(760, 620, 0.045, "square", 0.05);
            noise(0.02, 0.03, 3200, 8);
            break;
          case "start":
            tone(260, 640, 0.30, "square", 0.075);
            break;
          case "deny":
            tone(240, 150, 0.16, "sawtooth", 0.075);
            break;
        }
      } catch (err) { /* audio is a nicety */ }
    };

    var tapFn = null, setNameFn = null, ready = false;
    var canvas = document.getElementById("game");
    var screenBox = document.querySelector(".screen");
    var namebox = document.getElementById("namebox");

    /* the canvas borrows this field so a player can type their name */
    window.focusName = function (i, current) {
      namebox.dataset.idx = i;
      namebox.value = current || "";
      namebox.focus();
      try { namebox.setSelectionRange(namebox.value.length, namebox.value.length); } catch (e) {}
    };
    namebox.addEventListener("input", function () {
      if (setNameFn) setNameFn(parseInt(namebox.dataset.idx || "0", 10), namebox.value);
    });
    namebox.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { namebox.blur(); e.preventDefault(); }
      e.stopPropagation();
    });
    namebox.addEventListener("blur", function () {
      if (setNameFn) setNameFn(parseInt(namebox.dataset.idx || "0", 10), namebox.value);
    });

    function fit() {
      var aw = screenBox.clientWidth, ah = screenBox.clientHeight;
      if (!aw || !ah) return;
      var s = Math.min(aw / GW, ah / GH);
      canvas.style.width = Math.floor(GW * s) + "px";
      canvas.style.height = Math.floor(GH * s) + "px";
    }

    async function boot() {
      var msg = document.getElementById("loader-msg");
      var bar = document.getElementById("loader-bar");
      msg.textContent = "Downloading the Python runtime…";
      var pyodide = await loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/" });

      bar.style.width = "65%";
      msg.textContent = "Loading game.py…";
      var source = await (await fetch("game.py", { cache: "no-store" })).text();
      await pyodide.runPythonAsync(source);

      var update = pyodide.globals.get("update");
      var draw = pyodide.globals.get("draw");
      tapFn = pyodide.globals.get("tap");
      setNameFn = pyodide.globals.get("set_name");

      bar.style.width = "100%";
      ready = true;
      document.getElementById("loader").classList.add("is-hidden");
      fit();

      var last = performance.now();
      function frame(now) {
        var dt = (now - last) / 1000;
        last = now;
        update(dt);
        draw();
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    function canvasPoint(e) {
      var r = canvas.getBoundingClientRect();
      return [ (e.clientX - r.left) / r.width * GW,
               (e.clientY - r.top) / r.height * GH ];
    }

    canvas.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      if (!ready || !tapFn) return;
      audio();                       // the first tap wakes the audio up
      var p = canvasPoint(e);
      tapFn(p[0], p[1]);
    });
    canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

    window.addEventListener("keydown", function (e) {
      if (!ready || !tapFn) return;
      if (e.target === namebox) return;
      if (e.code === "Space" || e.code === "Enter") {
        tapFn(713, 316);            // the ROLL button
        e.preventDefault();
      }
    });

    document.getElementById("mute").addEventListener("click", function (e) {
      muted = !muted;
      document.getElementById("mute-icon").innerHTML = muted ? "&#128263;" : "&#128266;";
      e.currentTarget.setAttribute("aria-pressed", String(muted));
      e.currentTarget.blur();
    });

    /* ---- full screen ---- */
    (function () {
      var stage = document.querySelector(".stage");
      var btn = document.getElementById("fs");
      var wide = document.body.dataset.orient === "landscape";

      function mark(on) {
        btn.innerHTML = on ? "&#10064;" : "&#9974;";
        btn.setAttribute("aria-pressed", String(on));
        btn.title = on ? "Exit full screen" : "Full screen";
        document.documentElement.classList.toggle("fs-on", on);
        setTimeout(fit, 60);
      }
      function lockLandscape() {
        try {
          if (wide && screen.orientation && screen.orientation.lock) {
            var p = screen.orientation.lock("landscape");
            if (p && p.catch) p.catch(function () {});
          }
        } catch (e) {}
      }
      btn.addEventListener("click", function (e) {
        e.preventDefault();
        btn.blur();
        if (document.fullscreenElement) { document.exitFullscreen(); return; }
        if (stage.requestFullscreen) {
          var p = stage.requestFullscreen({ navigationUI: "hide" });
          if (p && p.then) p.then(lockLandscape, function () { mark(true); });
          else lockLandscape();
        } else {
          mark(true);
        }
      });
      document.addEventListener("fullscreenchange", function () {
        if (!document.fullscreenElement && screen.orientation && screen.orientation.unlock) {
          try { screen.orientation.unlock(); } catch (e) {}
        }
        mark(!!document.fullscreenElement);
      });
      mark(false);
    })();

    /* ---- rotate hint ---- */
    (function () {
      var box = document.getElementById("rotate");
      var btn = document.getElementById("rotate-dismiss");
      function dismissed() {
        try { return sessionStorage.getItem("khelo_rotate_ok") === "1"; } catch (e) { return false; }
      }
      function portrait() {
        return window.matchMedia("(orientation: portrait) and (max-width: 900px)").matches;
      }
      function update() {
        box.classList.toggle("is-on", portrait() && !dismissed() && !document.fullscreenElement);
      }
      btn.addEventListener("click", function () {
        try { sessionStorage.setItem("khelo_rotate_ok", "1"); } catch (e) {}
        update();
      });
      window.addEventListener("resize", update);
      window.addEventListener("orientationchange", update);
      document.addEventListener("fullscreenchange", update);
      update();
    })();

    window.addEventListener("resize", fit);
    window.addEventListener("orientationchange", fit);
    document.addEventListener("fullscreenchange", fit);

    boot().catch(function (err) {
      document.getElementById("loader-msg").textContent = "Could not start the game: " + err;
      console.error(err);
    });
  </script>
</body>
</html>
